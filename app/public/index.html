<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meal Planner</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥘</text></svg>">
<!-- Self-hosted fonts (OFL, licences in /fonts): the two upright faces are
     preloaded; the italics load on first use. No third-party font requests. -->
<link rel="preload" href="/fonts/libre-franklin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#F4EDE1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1D1A17" media="(prefers-color-scheme: dark)">
<script>
/* Per-device theme override (gear panel → This device), applied before first
   paint so a forced theme never flashes the system one. */
try {
  var t = localStorage.getItem('mealapp-theme');
  if (t === 'light' || t === 'dark') {
    document.documentElement.setAttribute('data-theme', t);
    document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = t === 'dark' ? '#1D1A17' : '#F4EDE1'; });
  }
} catch (e) { /* storage blocked — system theme */ }
</script>
</head>
<body>
<!-- Inline icon set (24-grid, round caps; stroke width from CSS). Referenced
     as <svg class="i"><use href="#i-…"/></svg> by the tab bar and by ico() in
     js/00-core.js. -->
<svg class="sprite" width="0" height="0" aria-hidden="true" focusable="false">
  <symbol id="i-week" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M7.5 14h2M11 14h2M14.5 14h2M7.5 17h2"/></symbol>
  <symbol id="i-cook" viewBox="0 0 24 24"><path d="M4 11h16v3.5A5.5 5.5 0 0 1 14.5 20h-5A5.5 5.5 0 0 1 4 14.5z"/><path d="M2.5 11h19"/><path d="M9 3.8c-.8 1 .8 1.9 0 3.2M12.5 3.8c-.8 1 .8 1.9 0 3.2M16 3.8c-.8 1 .8 1.9 0 3.2"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6.6C10 5 7.4 4.5 3.8 4.8v13.6c3.6-.3 6.2.2 8.2 1.8 2-1.6 4.6-2.1 8.2-1.8V4.8C16.6 4.5 14 5 12 6.6z"/><path d="M12 6.6v13.6"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M10 6.5h10M10 12h10M10 17.5h6"/><path d="M3.6 6.6l1.6 1.6 2.6-3.1M3.6 12.1l1.6 1.6 2.6-3.1"/><circle cx="5.6" cy="17.5" r="1.5"/></symbol>
  <symbol id="i-shop" viewBox="0 0 24 24"><path d="M3.5 9.5h17l-1.7 8.7a2 2 0 0 1-2 1.6H7.2a2 2 0 0 1-2-1.6z"/><path d="M8.5 9.5 11 4M15.5 9.5 13 4"/><path d="M9.5 13v3.5M14.5 13v3.5"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3"/><path d="M3.5 19c.5-3 2.8-4.8 5.5-4.8s5 1.8 5.5 4.8"/><circle cx="17" cy="9.5" r="2.3"/><path d="M15.6 14.4c2.6-.3 4.5 1.3 4.9 4.1"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5 9.5 17 19 7.5"/></symbol>
  <symbol id="i-check2" viewBox="0 0 24 24"><path d="M2.5 12.8 6.4 16.7 14.6 8"/><path d="M11.4 15.9l.8.8 9.3-9.2"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.4l2.65 5.4 5.95.86-4.3 4.2 1.02 5.92L12 17l-5.32 2.78 1.02-5.92-4.3-4.2 5.95-.86z"/></symbol>
  <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></symbol>
  <symbol id="i-swap" viewBox="0 0 24 24"><path d="M4 8h13l-3.2-3.2M20 16H7l3.2 3.2"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9.5l6 6 6-6"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 6.5 4.5 11 9 15.5"/><path d="M5 11h9.5a5 5 0 0 1 0 10H12"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></symbol>
</svg>

<div class="wrap">
  <!-- The kitchen window (Week tab only): the real sky and weather over the
       back woods. Drawn by js/05-window.js; the scene inside carries the
       role="img" + aria-label, the caption under the sill opens Settings. -->
  <section class="window" id="window" hidden aria-label="Kitchen window"></section>
  <header class="top">
    <button class="gear" id="btn-settings" type="button" aria-label="Settings" aria-haspopup="dialog">
      <svg class="i" aria-hidden="true"><use href="#i-gear"/></svg>
    </button>
    <p class="eyebrow" id="head-eyebrow"></p>
    <h1 id="head-title">Meal Planner</h1>
    <p class="sub" id="head-sub">loading…</p>
    <div class="headprog" id="head-progress" hidden><span></span></div>
  </header>

  <div class="strip quiet" id="strip" hidden>
    <span class="pulse" id="strip-pulse" hidden></span>
    <span class="grow" id="strip-text">…</span>
    <button id="strip-action" hidden></button>
  </div>

  <section class="view" id="view-week"></section>
  <section class="view" id="view-cook"></section>
  <section class="view" id="view-recipes"></section>
  <section class="view" id="view-next"></section>
  <section class="view" id="view-shop"></section>
</div>

<div class="sheet" id="settings" hidden>
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="sheet-head">
      <h2 id="settings-title">Settings</h2>
      <button class="sheet-x" type="button" aria-label="Close settings" data-close>✕</button>
    </div>
    <div class="sheet-body" id="settings-body"><p class="set-hint">loading…</p></div>
  </div>
</div>

<div id="toast" role="status"></div>

<nav class="tabs" role="tablist" aria-label="Sections">
  <button id="tab-week" role="tab" aria-selected="true"><span class="ind"><svg class="i" aria-hidden="true"><use href="#i-week"/></svg></span>Week</button>
  <button id="tab-cook" role="tab" aria-selected="false"><span class="ind"><svg class="i" aria-hidden="true"><use href="#i-cook"/></svg></span>Cook</button>
  <button id="tab-recipes" role="tab" aria-selected="false"><span class="ind"><svg class="i" aria-hidden="true"><use href="#i-book"/></svg></span>Recipes</button>
  <button id="tab-next" role="tab" aria-selected="false"><span class="ind"><svg class="i" aria-hidden="true"><use href="#i-next"/></svg></span>Next</button>
  <button id="tab-shop" role="tab" aria-selected="false"><span class="ind"><svg class="i" aria-hidden="true"><use href="#i-shop"/></svg></span>Shop</button>
</nav>

<!-- Classic scripts sharing one global scope, in this order (later files may
     use earlier ones at load time; 90-boot.js must stay last). -->
<script src="/js/00-core.js"></script>
<script src="/js/05-window.js"></script>
<script src="/js/10-week.js"></script>
<script src="/js/15-trends.js"></script>
<script src="/js/20-next.js"></script>
<script src="/js/30-shop.js"></script>
<script src="/js/40-recipes.js"></script>
<script src="/js/50-cook.js"></script>
<script src="/js/60-settings.js"></script>
<script src="/js/70-pantry.js"></script>
<script src="/js/80-ask.js"></script>
<script src="/js/90-boot.js"></script>
</body>
</html>
