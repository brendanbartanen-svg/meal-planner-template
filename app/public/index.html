<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meal Planner</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥘</text></svg>">
<link rel="stylesheet" href="/style.css">
<meta name="theme-color" content="#F6F6F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151813" media="(prefers-color-scheme: dark)">
<script>
/* Per-device theme override (gear panel → This device), applied before first
   paint so a forced theme never flashes the system one. */
try {
  var t = localStorage.getItem('mealapp-theme');
  if (t === 'light' || t === 'dark') {
    document.documentElement.setAttribute('data-theme', t);
    document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = t === 'dark' ? '#151813' : '#F6F6F1'; });
  }
} catch (e) { /* storage blocked — system theme */ }
</script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button class="gear" id="btn-settings" type="button" aria-label="Settings" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
    <h1 id="head-title">Meal Planner</h1>
    <p class="sub" id="head-sub">loading…</p>
  </header>

  <div class="strip quiet" id="strip" hidden>
    <span class="pulse" id="strip-pulse" hidden></span>
    <span class="grow" id="strip-text">…</span>
    <button id="strip-action" hidden></button>
  </div>

  <section class="view" id="view-week"></section>
  <section class="view" id="view-cook"></section>
  <section class="view" id="view-recipes"></section>
  <section class="view" id="view-next"></section>
  <section class="view" id="view-shop"></section>
</div>

<div class="sheet" id="settings" hidden>
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="sheet-head">
      <h2 id="settings-title">Settings</h2>
      <button class="sheet-x" type="button" aria-label="Close settings" data-close>✕</button>
    </div>
    <div class="sheet-body" id="settings-body"><p class="set-hint">loading…</p></div>
  </div>
</div>

<div id="toast" role="status"></div>

<nav class="tabs" role="tablist" aria-label="Sections">
  <button id="tab-week" role="tab" aria-selected="true">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    Week
  </button>
  <button id="tab-cook" role="tab" aria-selected="false">
    <svg viewBox="0 0 24 24"><path d="M12 3c3 3.4 6 6 6 10a6 6 0 0 1-12 0c0-2.6 1.3-4.4 2.7-6.2.4 1.7 1.1 2.7 2.3 3.5C10.6 8 11 5.4 12 3z"/></svg>
    Cook
  </button>
  <button id="tab-recipes" role="tab" aria-selected="false">
    <svg viewBox="0 0 24 24"><path d="M4 20V6a2 2 0 0 1 2-2h13v14H6a2 2 0 0 0-2 2zm0 0a2 2 0 0 0 2 2h13"/><path d="M9 8h6"/></svg>
    Recipes
  </button>
  <button id="tab-next" role="tab" aria-selected="false">
    <svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
    Next
  </button>
  <button id="tab-shop" role="tab" aria-selected="false">
    <svg viewBox="0 0 24 24"><path d="M4 6h2l2.4 11h9.8L21 9H7"/><circle cx="10" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>
    Shop
  </button>
</nav>

<script src="/app.js"></script>
</body>
</html>
